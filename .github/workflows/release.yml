name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release system
        run: python tests/test_release_system.py
      - name: Build privacy-safe release assets
        run: python tools/build_public_release.py
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamer-caption-release
          path: |
            dist/*.zip
            dist/release-manifest.json
      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip dist/release-manifest.json --draft --generate-notes --verify-tag
