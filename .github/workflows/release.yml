name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release system
        shell: pwsh
        run: |
          python tests/test_release_system.py
          python tests/test_updater_cache.py
      - name: Validate tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = "v$((Get-Content VERSION -Raw).Trim())"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag ${{ github.ref_name }} does not match VERSION $expected"
          }
      - name: Build privacy-safe release assets
        run: python tools/build_public_release.py
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamer-caption-release
          path: |
            dist/*.zip
            dist/release-manifest.json
      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = @(Get-ChildItem -LiteralPath dist -Filter "*.zip")
          if ($zip.Count -ne 1) {
            throw "Expected exactly one release ZIP; found $($zip.Count)"
          }
          $manifest = (Resolve-Path "dist/release-manifest.json").Path
          $releaseArgs = @("${{ github.ref_name }}", $zip[0].FullName, $manifest, "--draft", "--generate-notes", "--verify-tag")
          if ("${{ github.ref_name }}" -match "-") {
            $releaseArgs += "--prerelease"
          }
          gh release create @releaseArgs
