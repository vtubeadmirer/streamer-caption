name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release system
        shell: pwsh
        run: |
          python tests/test_release_system.py
          python tests/test_updater_cache.py
      - name: Validate tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = "v$((Get-Content VERSION -Raw).Trim())"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag ${{ github.ref_name }} does not match VERSION $expected"
          }
      - name: Fetch the published runtime manifest (optional)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $tag = (Get-Content release-manifest.json -Raw | ConvertFrom-Json).runtime_release_tag
          if ($tag) {
            gh release download $tag --pattern runtime-manifest.json --dir dist 2>$null
            if ($LASTEXITCODE -ne 0) { Write-Warning "No runtime release $tag yet; manifest keeps the template runtime fields." }
          }
      - name: Build privacy-safe release assets
        run: python tools/build_public_release.py
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamer-caption-release
          path: |
            dist/*.zip
            dist/release-manifest.json
      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zips = @(Get-ChildItem -LiteralPath dist -Filter "*.zip" | Where-Object { $_.Name -notlike "runtime-*" })
          if ($zips.Count -lt 1) {
            throw "No release ZIP was built"
          }
          $manifest = (Resolve-Path "dist/release-manifest.json").Path
          $releaseArgs = @("${{ github.ref_name }}") + @($zips | ForEach-Object { $_.FullName }) + @($manifest, "--draft", "--generate-notes", "--verify-tag")
          if ("${{ github.ref_name }}" -match "-") {
            $releaseArgs += "--prerelease"
          }
          gh release create @releaseArgs
