name: Build portable runtime

# Builds runtime-<version>.zip (embedded Python 3.12 + requirements.txt, venv layout)
# and publishes it as the release "runtime-<version>". The app's release manifest
# points portable installs at this asset; it only changes when requirements change.
# A published runtime is never replaced: installed apps pin its SHA-256, so a rebuild
# needs a new runtime_version in release-manifest.json.

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: "Runtime version tag suffix (e.g. py312-v3)"
        required: true
        default: "py312-v3"
  push:
    branches: ["main"]
    paths:
      - "requirements.txt"
      - "tools/build_runtime.py"
      - ".github/workflows/runtime.yml"

permissions:
  contents: write

jobs:
  runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve runtime version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.runtime_version }}"
          if (-not $v) { $v = (Get-Content release-manifest.json -Raw | ConvertFrom-Json).runtime_version }
          if (-not $v) { $v = "py312-v3" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Check whether this runtime is already published
        id: exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "runtime-${{ steps.ver.outputs.version }}"
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # A published runtime is never replaced: installed apps verify its SHA-256. A push that
            # touches the build inputs without bumping runtime_version is therefore a no-op here,
            # while an explicit workflow_dispatch for an existing tag is a mistake worth failing.
            if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              Write-Output "::error::Release $tag already exists. Bump runtime_version, runtime_asset_name and runtime_release_tag in release-manifest.json."
              exit 1
            }
            Write-Output "::notice::Release $tag already exists; nothing to build. Bump runtime_version in release-manifest.json to publish a new runtime."
            "published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "published=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          # gh's "release not found" left $LASTEXITCODE=1, which the runner would report as this step's result.
          exit 0
      - name: Build runtime ZIP
        if: steps.exists.outputs.published != 'true'
        run: python tools/build_runtime.py --runtime-version ${{ steps.ver.outputs.version }}
      - name: Upload workflow artifact
        if: steps.exists.outputs.published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ steps.ver.outputs.version }}
          path: |
            dist/runtime-*.zip
            dist/runtime-manifest.json
      - name: Publish as release runtime-${{ steps.ver.outputs.version }}
        if: steps.exists.outputs.published != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "runtime-${{ steps.ver.outputs.version }}"
          $zip = (Get-ChildItem dist -Filter "runtime-*.zip" | Select-Object -First 1).FullName
          $manifest = (Resolve-Path dist/runtime-manifest.json).Path
          # Never "Latest": the app updater reads /releases/latest and must only ever see app releases.
          gh release create $tag $zip $manifest --latest=false --title "Portable runtime $tag" --notes "Embedded Python ${{ steps.ver.outputs.version }} runtime for the no-install launcher. Not an app release."
