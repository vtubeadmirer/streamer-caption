name: Validate

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app requirements for the test suite
        run: python -m pip install --quiet -r requirements.txt
      - name: Run the CI test set
        run: python tools/ci_check.py
