<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>streamer-caption-v2 preview</title>
  <style>
    :root {
      color-scheme: dark;
      --text: #ffffff;
      --pending: rgba(220, 226, 235, 0.58);
      --shadow: rgba(0, 0, 0, 0.92);
      --accent: #20c997;
      --caption-size: 34px;
      --previous-opacity: 0.55;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Malgun Gothic", "Segoe UI", sans-serif;
    }
    body.preview {
      background: #111;
    }
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 36px;
      box-sizing: border-box;
    }
    .caption {
      max-width: min(1120px, 94vw);
      text-align: center;
      font-size: var(--caption-size);
      line-height: 1.26;
      font-weight: 800;
      color: var(--text);
      text-shadow:
        -2px -2px 0 var(--shadow),
        2px -2px 0 var(--shadow),
        -2px 2px 0 var(--shadow),
        2px 2px 0 var(--shadow),
        0 4px 14px rgba(0, 0, 0, 0.55);
      transform: translateY(12px);
      opacity: 0;
      transition: opacity 160ms ease, transform 160ms ease;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .line.previous {
      opacity: var(--previous-opacity);
    }
    .line.pending {
      color: var(--pending);
    }
    /* 정확 우선 engine: words that are never revised, shown as they arrive */
    .line.pending.stable {
      color: var(--text);
    }
    .source-label {
      display: inline-block;
      margin-right: 0.35em;
      font-size: 0.58em;
      font-weight: 800;
      vertical-align: 0.12em;
    }
    .source-microphone .source-label { color: #49d89b; }
    .source-system .source-label { color: #67b7ff; }
    .pending-slot:not(:empty) {
      margin-top: 0.08em;
    }
    .caption.show {
      opacity: 1;
      transform: translateY(0);
    }
    .status {
      position: fixed;
      top: 12px;
      right: 14px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.72);
      background: rgba(0, 0, 0, 0.28);
      border-left: 3px solid var(--accent);
      padding: 6px 8px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div id="caption" class="caption">
      <div id="confirmedCaption" class="confirmed-stack"></div>
      <div id="pendingCaption" class="pending-slot"></div>
    </div>
  </div>
  <div id="status" class="status">connecting</div>
  <script>
    const caption = document.getElementById("caption");
    const confirmedCaption = document.getElementById("confirmedCaption");
    const pendingCaption = document.getElementById("pendingCaption");
    const statusEl = document.getElementById("status");
    const params = new URLSearchParams(location.search);
    const sourceFilter = String(params.get("source") || "both").toLowerCase();
    if (params.get("preview") !== "0") document.body.classList.add("preview");

    let confirmedHistory = [];
    let confirmedQueue = [];
    let queuedConfirmedKeys = new Set();
    let seenConfirmedKeys = new Set();
    let queuedConfirmedContentKeys = new Set();
    let seenConfirmedContentKeys = new Set();
    let pendingText = "";
    let pendingSource = "";
    let pendingSourceLabel = "";
    // A stable pending line (metadata.stable) only grows and is committed as-is, so it stays
    // until its confirmed line is on screen instead of disappearing first.
    let pendingStable = false;
    let pendingOffset = -1;
    let lastPendingKey = "";
    let lastPendingOffsets = { microphone: -1, system: -1 };
    let lastConfirmedOffsets = { microphone: -1, system: -1 };
    let showSourceLabels = true;
    let sourceLabels = { microphone: "방송자", system: "컴퓨터" };
    let lastConfirmedAt = 0;
    let lastConfirmedCommitAt = 0;
    let lastPendingAt = 0;
    let hideTimer = null;
    let pendingTimer = null;
    let queueTimer = null;
    let maxLines = Number(params.get("maxLines") || 2);
    let historyMaxItems = 1000;
    let justChattingMode = false;
    let justChattingMinAdvanceMs = 650;
    let confirmedHoldMs = Number(params.get("holdMs") || 6000);
    let pendingStaleMs = Number(params.get("pendingStaleMs") || 3000);
    let wsPort = 8765;
    let connected = false;
    let configSignature = "";

    function adminUrl(path) {
      const requestedOrigin = params.get("adminOrigin");
      const origin = requestedOrigin || (
        location.protocol === "file:"
          ? "http://127.0.0.1:8766"
          : location.origin
      );
      return new URL(path, origin).toString();
    }

    async function loadOverlayConfig() {
      try {
        const response = await fetch(
          adminUrl("/api/config"),
          { cache: "no-store" }
        );
        if (!response.ok) return;
        const config = await response.json();
        const captionConfig = config.caption || {};
        const streamingConfig = config.streaming || {};
        showSourceLabels = captionConfig.show_source_labels !== false;
        sourceLabels = {
          microphone: String(captionConfig.microphone_label || "방송자"),
          system: String(captionConfig.system_label || "컴퓨터"),
        };
        const configuredSize = Number(captionConfig.ko_size || 34);
        const sizeParam = Number(
          params.get("size") || params.get("koSize") || 0
        );
        const lineParam = Number(params.get("maxLines") || 0);
        const holdParam = Number(params.get("holdMs") || 0);
        const staleParam = Number(params.get("pendingStaleMs") || 0);

        const nextMaxLines = Math.max(
          1,
          Math.min(
            500,
            lineParam || Number(captionConfig.max_lines || 2)
          )
        );
        const nextJustChattingMode = Boolean(
          captionConfig.just_chatting_mode
        );
        const nextHistoryMaxItems = Math.max(
          12,
          Math.min(
            10000,
            Number(captionConfig.history_max_items || 1000)
          )
        );
        const nextMinAdvanceMs = Math.max(
          0,
          Math.min(
            5000,
            Number(
              captionConfig.just_chatting_min_line_hold_sec ?? 0.65
            ) * 1000
          )
        );
        const nextConfirmedHoldMs = Math.max(
          250,
          holdParam
            || Number(streamingConfig.confirmed_hold_sec || 6) * 1000
        );
        const nextPendingStaleMs = Math.max(
          250,
          staleParam
            || Number(streamingConfig.pending_stale_sec || 3) * 1000
        );
        const nextSignature = [
          nextMaxLines,
          nextJustChattingMode,
          nextHistoryMaxItems,
          nextMinAdvanceMs,
          nextConfirmedHoldMs,
          nextPendingStaleMs,
          sizeParam || configuredSize,
          captionConfig.prev_opacity ?? 0.55,
          showSourceLabels,
          sourceLabels.microphone,
          sourceLabels.system,
        ].join("|");

        maxLines = nextMaxLines;
        justChattingMode = nextJustChattingMode;
        historyMaxItems = nextHistoryMaxItems;
        justChattingMinAdvanceMs = nextMinAdvanceMs;
        confirmedHoldMs = nextConfirmedHoldMs;
        pendingStaleMs = nextPendingStaleMs;
        wsPort = Number(config.server?.port || wsPort);
        document.documentElement.style.setProperty(
          "--caption-size",
          String(sizeParam || configuredSize) + "px"
        );
        document.documentElement.style.setProperty(
          "--previous-opacity",
          String(captionConfig.prev_opacity ?? 0.55)
        );

        if (nextSignature !== configSignature) {
          configSignature = nextSignature;
          trimConfirmedHistory();
          render();
          scheduleTimers();
          drainConfirmedQueue();
        }
      } catch (error) {
        console.info(
          "caption config unavailable; using defaults or URL params"
        );
      }
    }

    function updateVisibility() {
      caption.classList.toggle(
        "show",
        Boolean(
          confirmedHistory.length
          || confirmedQueue.length
          || pendingText
        )
      );
    }

    function messageSource(message) {
      const source = String(
        message?.metadata?.audio_source || "microphone"
      ).toLowerCase();
      return source === "system" ? "system" : "microphone";
    }

    function acceptsSource(source) {
      return !["microphone", "system"].includes(sourceFilter)
        || sourceFilter === source;
    }

    function sourceLabelHtml(source, label) {
      if (!showSourceLabels || sourceFilter !== "both") return "";
      return '<span class="source-label">['
        + escapeHtml(label || sourceLabels[source] || source)
        + "]</span>";
    }

    function renderConfirmed() {
      const confirmedLines = confirmedHistory.slice(-maxLines);
      confirmedCaption.innerHTML = confirmedLines.map((entry, index) => {
        const className = index === confirmedLines.length - 1
          ? "current"
          : "previous";
        return '<div class="line ' + className
          + ' source-' + escapeHtml(entry.source) + '">'
          + sourceLabelHtml(entry.source, entry.sourceLabel)
          + escapeHtml(entry.text)
          + "</div>";
      }).join("");
      updateVisibility();
    }

    function renderPending() {
      pendingCaption.innerHTML = pendingText
        ? '<div class="line pending' + (pendingStable ? " stable" : "")
          + ' source-' + escapeHtml(pendingSource) + '">'
          + sourceLabelHtml(pendingSource, pendingSourceLabel)
          + escapeHtml(pendingText)
          + "</div>"
        : "";
      updateVisibility();
    }

    function render() {
      renderConfirmed();
      renderPending();
      updateStatus();
    }
    function scheduleTimers() {
      clearTimeout(hideTimer);
      clearTimeout(pendingTimer);

      if (pendingText) {
        const staleMs = pendingStable
          ? Math.max(pendingStaleMs, confirmedHoldMs)
          : pendingStaleMs;
        const remaining = Math.max(
          0,
          staleMs - (Date.now() - lastPendingAt)
        );
        pendingTimer = setTimeout(() => {
          pendingText = "";
          pendingStable = false;
          renderPending();
        }, remaining);
      }

      if (!justChattingMode && confirmedHistory.length) {
        const remaining = Math.max(
          0,
          confirmedHoldMs - (Date.now() - lastConfirmedAt)
        );
        hideTimer = setTimeout(() => {
          if (justChattingMode) return;
          if (!pendingStable) pendingText = "";
          confirmedHistory = [];
          seenConfirmedKeys.clear();
          seenConfirmedContentKeys.clear();
          render();
        }, remaining);
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function trimConfirmedHistory() {
      while (confirmedHistory.length > historyMaxItems) {
        const removed = confirmedHistory.shift();
        if (removed) seenConfirmedKeys.delete(removed.key);
        if (removed) seenConfirmedContentKeys.delete(removed.contentKey);
      }
    }

    function commitConfirmedBatch(entries) {
      let replacesStablePending = false;
      entries.forEach((entry) => {
        queuedConfirmedKeys.delete(entry.key);
        queuedConfirmedContentKeys.delete(entry.contentKey);
        if (
          pendingStable
          && entry.source === pendingSource
          && entry.offset >= pendingOffset
        ) {
          replacesStablePending = true;
        }
        if (
          seenConfirmedKeys.has(entry.key)
          || seenConfirmedContentKeys.has(entry.contentKey)
        ) return;
        seenConfirmedKeys.add(entry.key);
        seenConfirmedContentKeys.add(entry.contentKey);
        confirmedHistory.push(entry);
      });
      trimConfirmedHistory();
      lastConfirmedAt = Date.now();
      lastConfirmedCommitAt = lastConfirmedAt;
      if (replacesStablePending) {
        // Same render: the growing line becomes the confirmed line without a blank frame.
        pendingText = "";
        pendingSource = "";
        pendingSourceLabel = "";
        pendingStable = false;
        lastPendingKey = "";
        renderPending();
      }
      renderConfirmed();
      scheduleTimers();
    }

    function drainConfirmedQueue() {
      if (queueTimer || !confirmedQueue.length) {
        updateStatus();
        return;
      }
      let interval = justChattingMode
        ? justChattingMinAdvanceMs
        : 0;
      if (
        justChattingMode
        && confirmedQueue.length > maxLines * 2
      ) {
        interval = Math.max(200, interval * 0.5);
      }
      const elapsed = Date.now() - lastConfirmedCommitAt;
      const delay = Math.max(0, interval - elapsed);
      queueTimer = setTimeout(() => {
        queueTimer = null;
        const first = confirmedQueue.shift();
        const batch = first ? [first] : [];
        while (
          first
          && confirmedQueue.length
          && confirmedQueue[0].batchKey === first.batchKey
        ) {
          batch.push(confirmedQueue.shift());
        }
        if (batch.length) commitConfirmedBatch(batch);
        updateStatus();
        drainConfirmedQueue();
      }, delay);
    }

    function enqueueConfirmed(message) {
      const text = String(message.text || "").trim();
      if (!text) return;
      const source = messageSource(message);
      if (!acceptsSource(source)) return;
      const offset = Number(
        message.audio_offset_sec ?? lastConfirmedOffsets[source]
      );
      if (offset < lastConfirmedOffsets[source]) return;
      lastConfirmedOffsets[source] = Math.max(
        lastConfirmedOffsets[source],
        offset
      );
      const metadata = message.metadata || {};
      const sourceLabel = String(
        metadata.source_label || sourceLabels[source] || source
      );
      const splitIndex = metadata.split_index ?? "";
      const key = [
        source,
        offset.toFixed(3),
        splitIndex,
        text,
      ].join(":");
      const batchKey = [source, offset.toFixed(3)].join(":");
      const contentKey = [source, offset.toFixed(3), text].join(":");
      if (
        queuedConfirmedKeys.has(key)
        || seenConfirmedKeys.has(key)
        || queuedConfirmedContentKeys.has(contentKey)
        || seenConfirmedContentKeys.has(contentKey)
      ) {
        return;
      }

      if (pendingSource === source && !pendingStable) {
        pendingText = "";
        pendingSource = "";
        pendingSourceLabel = "";
        lastPendingKey = "";
        renderPending();
      }
      confirmedQueue.push({
        key,
        contentKey,
        batchKey,
        text,
        offset,
        source,
        sourceLabel,
      });
      queuedConfirmedKeys.add(key);
      queuedConfirmedContentKeys.add(contentKey);
      updateVisibility();
      updateStatus();
      drainConfirmedQueue();
    }
    function applyMessage(message) {
      if (message.type === "sync") {
        for (const item of message.items || []) applyMessage(item);
        return;
      }
      if (
        message.type === "caption_confirmed"
        || message.type === "caption"
      ) {
        enqueueConfirmed(message);
        return;
      }
      if (message.type === "caption_pending") {
        const source = messageSource(message);
        if (!acceptsSource(source)) return;
        const text = String(message.text || "").trim();
        const offset = Number(message.audio_offset_sec ?? 0);
        const key = [source, offset.toFixed(2), text].join(":");
        if (
          !text
          || key === lastPendingKey
          || offset < lastPendingOffsets[source]
          || offset <= lastConfirmedOffsets[source]
        ) {
          return;
        }
        lastPendingKey = key;
        lastPendingOffsets[source] = offset;
        pendingText = text;
        pendingSource = source;
        pendingStable = Boolean(message.metadata?.stable);
        pendingOffset = offset;
        pendingSourceLabel = String(
          message.metadata?.source_label || sourceLabels[source] || source
        );
        lastPendingAt = Date.now();
        renderPending();
        scheduleTimers();
        return;
      }
      if (message.type === "caption_hidden") {
        const source = messageSource(message);
        const offset = Number(message.audio_offset_sec ?? 0);
        if (
          pendingSource === source
          && offset >= lastPendingOffsets[source]
        ) {
          pendingText = "";
          pendingSource = "";
          pendingSourceLabel = "";
          renderPending();
          scheduleTimers();
        }
      }
    }
    function updateStatus() {
      if (!connected) return;
      statusEl.textContent = confirmedQueue.length
        ? "connected | 읽기 대기 " + confirmedQueue.length
        : "connected";
    }

    function connect() {
      const host = location.hostname || "127.0.0.1";
      const socket = new WebSocket(
        "ws://" + host + ":" + wsPort
      );
      socket.addEventListener("open", () => {
        connected = true;
        updateStatus();
      });
      socket.addEventListener("message", (event) => {
        try {
          applyMessage(JSON.parse(event.data));
        } catch (error) {
          console.error(error);
        }
      });
      socket.addEventListener("close", () => {
        connected = false;
        statusEl.textContent = "reconnecting";
        setTimeout(connect, 1000);
      });
      socket.addEventListener("error", () => {
        statusEl.textContent = "connection error";
      });
    }

    loadOverlayConfig().finally(connect);
    setInterval(loadOverlayConfig, 1000);
  </script>
</body>
</html>
